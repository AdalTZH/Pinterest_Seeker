<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Poster Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 24px;
        }

        /* ── Search panel ─────────────────────────────────────── */
        .search-panel {
            max-width: 600px;
            margin: 0 auto 24px;
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .search-panel label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
        }
        .search-panel input, .search-panel select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .search-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }
        #btnSearch {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #e60023;
            color: #fff;
            margin-top: 4px;
            transition: transform 0.1s;
        }
        #btnSearch:active { transform: scale(0.97); }
        #btnSearch:disabled { background: #ccc; cursor: not-allowed; }

        /* ── Progress bar ─────────────────────────────────────── */
        .progress-panel {
            display: none;
            max-width: 600px;
            margin: 0 auto 24px;
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        .progress-panel.active { display: block; }
        .progress-panel .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #ddd;
            border-top-color: #e60023;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        .progress-panel .progress-text {
            color: #555;
            font-size: 0.95rem;
        }
        .progress-bar-container {
            display: none;
            max-width: 400px;
            margin: 12px auto 0;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-container.active { display: block; }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #e60023;
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        .progress-detail {
            display: none;
            color: #999;
            font-size: 0.8rem;
            margin-top: 6px;
        }
        .progress-detail.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Config panel (shown after results) ───────────────── */
        .config-panel {
            display: none;
            max-width: 700px;
            margin: 0 auto 24px;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .config-panel.active {
            display: grid;
        }
        .config-panel label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
        }
        .config-panel input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        /* ── Actions bar ──────────────────────────────────────── */
        .actions {
            display: none;
            text-align: center;
            margin-bottom: 24px;
        }
        .actions.active { display: block; }
        .actions button {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 8px;
            transition: transform 0.1s;
        }
        .actions button:active { transform: scale(0.97); }
        #btnGenerate {
            background: #e60023;
            color: #fff;
        }
        #btnGenerate:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #btnSelectAll {
            background: #eee;
            color: #333;
        }
        #btnNewSearch {
            background: #eee;
            color: #333;
        }

        /* ── Grid ─────────────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            position: relative;
            transition: box-shadow 0.2s, transform 0.15s;
        }
        .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); transform: translateY(-2px); }
        .card.selected { outline: 3px solid #e60023; }
        .card img {
            width: 100%;
            display: block;
            object-fit: cover;
            height: 260px;
        }
        .card-body { padding: 10px 12px; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
        }
        .badge.high { background: #0a8754; }
        .badge.mid  { background: #f5a623; }
        .badge.low  { background: #d93025; }
        .reason {
            font-size: 0.8rem;
            color: #666;
            margin-top: 6px;
            line-height: 1.3;
        }
        .poster-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.8rem;
            color: #e60023;
            font-weight: 600;
            text-decoration: none;
        }

        /* Checkmark overlay */
        .card.selected::after {
            content: "\2713";
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e60023;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
        }

        /* Status bar */
        .status {
            text-align: center;
            margin-top: 24px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>Pinterest Poster Agent</h1>
    <p class="subtitle">Search for products on Pinterest, review scored images, and generate posters</p>

    <!-- ── STEP 1: Search ──────────────────────────────────── -->
    <div class="search-panel" id="searchPanel">
        <label for="keyword">What product are you looking for?</label>
        <input type="text" id="keyword" placeholder="e.g. evening dresses, silk skirts, summer hats...">

        <label for="category">Product category (optional)</label>
        <input type="text" id="category" placeholder="e.g. dresses, skirts — defaults to keyword">

        <div class="search-row" style="grid-template-columns: 1fr 1fr;">
            <div>
                <label for="maxPins">Max pins</label>
                <input type="number" id="maxPins" value="40" min="1" max="100">
            </div>
            <div>
                <label for="timeout">Timeout (sec)</label>
                <input type="number" id="timeout" value="180" min="30" max="600">
            </div>
        </div>

        <button id="btnSearch">Search Pinterest</button>
    </div>

    <!-- ── STEP 2: Progress ────────────────────────────────── -->
    <div class="progress-panel" id="progressPanel">
        <div class="spinner"></div>
        <p class="progress-text" id="progressText">Starting search...</p>
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-detail" id="progressDetail"></p>
    </div>

    <!-- ── STEP 3: Results ─────────────────────────────────── -->
    <div class="config-panel" id="configPanel">
        <div>
            <label>Product Name</label>
            <input type="text" id="productName" placeholder="e.g. Silk Evening Dress">
        </div>
        <div>
            <label>Price</label>
            <input type="text" id="price" placeholder="e.g. $129.99">
        </div>
        <div>
            <label>Logo URL (optional)</label>
            <input type="text" id="logoUrl" placeholder="https://...">
        </div>
        <div>
            <label>Tagline</label>
            <input type="text" id="tagline" placeholder="e.g. Elegance Redefined">
        </div>
    </div>

    <div class="actions" id="actionsBar">
        <button id="btnNewSearch">New Search</button>
        <button id="btnSelectAll">Select All Approved</button>
        <button id="btnGenerate" disabled>Generate Posters (0)</button>
    </div>

    <div class="grid" id="grid"></div>
    <p class="status" id="status"></p>

    <script>
        // ── DOM refs ──────────────────────────────────────────
        const searchPanel   = document.getElementById("searchPanel");
        const progressPanel = document.getElementById("progressPanel");
        const progressText      = document.getElementById("progressText");
        const progressBar       = document.getElementById("progressBar");
        const progressBarCtr    = document.getElementById("progressBarContainer");
        const progressDetail    = document.getElementById("progressDetail");
        const configPanel   = document.getElementById("configPanel");
        const actionsBar    = document.getElementById("actionsBar");
        const grid          = document.getElementById("grid");
        const status        = document.getElementById("status");
        const btnSearch     = document.getElementById("btnSearch");
        const btnGenerate   = document.getElementById("btnGenerate");
        const btnSelectAll  = document.getElementById("btnSelectAll");
        const btnNewSearch  = document.getElementById("btnNewSearch");

        let results = [];
        let selected = new Set();
        let pollTimer = null;

        // ── Helpers ───────────────────────────────────────────
        function badgeClass(score) {
            if (score >= 7) return "high";
            if (score >= 4) return "mid";
            return "low";
        }

        function updateGenerateBtn() {
            const n = selected.size;
            btnGenerate.textContent = `Generate Posters (${n})`;
            btnGenerate.disabled = n === 0;
        }

        function showPhase(phase) {
            searchPanel.style.display   = phase === "search"   ? "block" : "none";
            progressPanel.className     = phase === "progress"  ? "progress-panel active" : "progress-panel";
            configPanel.className       = phase === "results"   ? "config-panel active" : "config-panel";
            actionsBar.className        = phase === "results"   ? "actions active" : "actions";
            if (phase !== "results") {
                grid.innerHTML = "";
                status.textContent = "";
            }
        }

        // ── Render grid ───────────────────────────────────────
        function renderGrid() {
            grid.innerHTML = "";
            results.forEach(item => {
                const card = document.createElement("div");
                card.className = "card" + (selected.has(item.id) ? " selected" : "");
                card.innerHTML = `
                    <img src="${item.thumbnail_url}" alt="Pin ${item.id}" loading="lazy">
                    <div class="card-body">
                        <span class="badge ${badgeClass(item.score)}">${item.score}/10</span>
                        <p class="reason">${item.reason}</p>
                        ${item.poster_path ? `<a class="poster-link" href="/${item.poster_path}" target="_blank">View Poster</a>` : ""}
                    </div>
                `;
                card.addEventListener("click", () => {
                    if (selected.has(item.id)) {
                        selected.delete(item.id);
                    } else {
                        selected.add(item.id);
                    }
                    renderGrid();
                    updateGenerateBtn();
                });
                grid.appendChild(card);
            });
        }

        // ── Search flow ───────────────────────────────────────
        btnSearch.addEventListener("click", async () => {
            const keyword = document.getElementById("keyword").value.trim();
            if (!keyword) {
                alert("Please enter a product to search for.");
                return;
            }

            btnSearch.disabled = true;
            showPhase("progress");
            progressText.textContent = `Searching Pinterest for "${keyword}"...`;

            try {
                const res = await fetch("/api/search", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        keyword: keyword,
                        category: document.getElementById("category").value.trim() || "",
                        max_pins: parseInt(document.getElementById("maxPins").value) || 40,
                        session_timeout_s: parseInt(document.getElementById("timeout").value) || 180,
                    }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.error || "Search failed");
                    showPhase("search");
                    btnSearch.disabled = false;
                    return;
                }

                // Start polling for status
                pollTimer = setInterval(pollSearchStatus, 2000);

            } catch (e) {
                alert("Network error: " + e.message);
                showPhase("search");
                btnSearch.disabled = false;
            }
        });

        async function pollSearchStatus() {
            try {
                const res = await fetch("/api/search/status");
                const data = await res.json();
                const msg = data.progress || "Working...";

                // Parse scoring progress for bar updates
                const scoringMatch = msg.match(/Scoring pin (\d+) of (\d+)/);
                const scoredMatch = msg.match(/Scored pin (\d+) of (\d+): (\d+)\/10/);

                if (scoredMatch) {
                    const current = parseInt(scoredMatch[1]);
                    const total = parseInt(scoredMatch[2]);
                    const pct = Math.round((current / total) * 100);
                    progressText.textContent = `Scoring images with AI... (${current}/${total})`;
                    progressBar.style.width = pct + "%";
                    progressBarCtr.className = "progress-bar-container active";
                    progressDetail.textContent = `Pin ${current}: ${scoredMatch[3]}/10`;
                    progressDetail.className = "progress-detail active";
                } else if (scoringMatch) {
                    const current = parseInt(scoringMatch[1]);
                    const total = parseInt(scoringMatch[2]);
                    const pct = Math.max(Math.round(((current - 1) / total) * 100), 2);
                    progressText.textContent = `Scoring images with AI... (${current - 1}/${total})`;
                    progressBar.style.width = pct + "%";
                    progressBarCtr.className = "progress-bar-container active";
                    progressDetail.textContent = `Analyzing pin ${current}...`;
                    progressDetail.className = "progress-detail active";
                } else if (msg.includes("Connecting")) {
                    progressText.textContent = "Connecting to Pinterest...";
                    progressBarCtr.className = "progress-bar-container";
                    progressDetail.className = "progress-detail";
                } else if (msg.includes("extracting")) {
                    progressText.textContent = "Loading Pinterest results...";
                    progressBarCtr.className = "progress-bar-container";
                    progressDetail.className = "progress-detail";
                } else if (msg.includes("Found")) {
                    progressText.textContent = msg;
                    progressBarCtr.className = "progress-bar-container";
                    progressDetail.className = "progress-detail";
                } else if (msg.includes("Extracted")) {
                    progressText.textContent = msg;
                    progressBarCtr.className = "progress-bar-container active";
                    progressBar.style.width = "2%";
                    progressDetail.className = "progress-detail";
                } else {
                    progressText.textContent = msg;
                }

                if (data.status === "done") {
                    clearInterval(pollTimer);
                    pollTimer = null;
                    await loadResults();
                } else if (data.status === "error") {
                    clearInterval(pollTimer);
                    pollTimer = null;
                    alert("Search failed: " + (data.error || "Unknown error"));
                    showPhase("search");
                    btnSearch.disabled = false;
                }
            } catch (e) {
                // Network hiccup — keep polling
            }
        }

        // ── Load results ──────────────────────────────────────
        async function loadResults() {
            try {
                const res = await fetch("/api/results");
                results = await res.json();
                selected.clear();

                if (results.length === 0) {
                    status.textContent = "No pins found. Try a different search.";
                    showPhase("search");
                    btnSearch.disabled = false;
                } else {
                    showPhase("results");
                    status.textContent = `${results.length} pins scored — select images to generate posters`;
                    renderGrid();
                    updateGenerateBtn();
                }
            } catch (e) {
                status.textContent = "Error loading results: " + e.message;
            }
        }

        // ── Select All Approved ───────────────────────────────
        btnSelectAll.addEventListener("click", () => {
            const approved = results.filter(r => r.approve);
            if (selected.size === approved.length) {
                selected.clear();
            } else {
                approved.forEach(r => selected.add(r.id));
            }
            renderGrid();
            updateGenerateBtn();
        });

        // ── New Search ────────────────────────────────────────
        btnNewSearch.addEventListener("click", () => {
            results = [];
            selected.clear();
            showPhase("search");
            btnSearch.disabled = false;
        });

        // ── Generate Posters ──────────────────────────────────
        btnGenerate.addEventListener("click", async () => {
            if (selected.size === 0) return;
            btnGenerate.disabled = true;
            status.textContent = "Generating posters...";

            try {
                const res = await fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        selected_ids: [...selected],
                        product_name: document.getElementById("productName").value || "Product",
                        price: document.getElementById("price").value || "",
                        tagline: document.getElementById("tagline").value || "",
                        logo_url: document.getElementById("logoUrl").value || "",
                    }),
                });
                const data = await res.json();
                status.textContent = `Generated ${data.generated?.length || 0} poster(s)`;
                selected.clear();
                await loadResults();
            } catch (e) {
                status.textContent = "Error: " + e.message;
            } finally {
                updateGenerateBtn();
            }
        });

        // ── Initial state ─────────────────────────────────────
        showPhase("search");
    </script>
</body>
</html>
