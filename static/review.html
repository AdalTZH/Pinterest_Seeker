<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Poster Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf8f5;
            --card-bg: #ffffff;
            --panel-bg: #ffffff;
            --text: #2c2c2c;
            --text-secondary: #6b6b6b;
            --text-muted: #9a9a9a;
            --accent: #b8860b;
            --accent-hover: #9a7209;
            --accent-light: #f5f0e3;
            --border: #e8e4df;
            --border-light: #f0ece7;
            --badge-high: #2d6a4f;
            --badge-mid: #bc6c25;
            --badge-low: #c1121f;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --radius: 14px;
            --radius-sm: 10px;
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ──────────────────────────────────────────── */
        .header {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .header-left h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .header-left p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 300;
        }
        .lang-toggle {
            display: flex;
            background: var(--border-light);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            flex-shrink: 0;
            margin-top: 4px;
        }
        .lang-toggle button {
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 500;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
            font-family: var(--font-body);
        }
        .lang-toggle button.active {
            background: var(--card-bg);
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }

        /* ── Panels ──────────────────────────────────────────── */
        .panel {
            max-width: 560px;
            margin: 32px auto;
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 32px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow);
        }
        .panel.wide {
            max-width: 900px;
        }

        .panel label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .panel input[type="text"],
        .panel input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font-body);
            color: var(--text);
            background: var(--bg);
            margin-bottom: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .panel input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(184,134,11,0.1);
        }
        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ── Buttons ─────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font-body);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            width: 100%;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--border-light); }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
        }
        .btn-ghost:hover { color: var(--text); background: var(--bg); }

        /* ── Progress ────────────────────────────────────────── */
        .progress-panel {
            text-align: center;
            padding: 48px 32px;
        }
        .progress-panel .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        .progress-panel .progress-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .progress-bar-wrap {
            max-width: 320px;
            margin: 16px auto 0;
            height: 4px;
            background: var(--border-light);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar-wrap.hidden { display: none; }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .progress-detail {
            color: var(--text-muted);
            font-size: 0.78rem;
            margin-top: 8px;
        }
        .progress-detail.hidden { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Gallery toolbar ─────────────────────────────────── */
        .gallery-toolbar {
            max-width: 900px;
            margin: 0 auto 16px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gallery-toolbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gallery-toolbar .scoring-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 500;
        }
        .gallery-toolbar .scoring-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .gallery-toolbar .count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ── Image grid ──────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-3px);
        }
        .card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), var(--shadow);
        }
        .card img {
            width: 100%;
            display: block;
            object-fit: cover;
            height: 280px;
            background: var(--border-light);
        }
        .card-body {
            padding: 14px 16px;
        }

        /* Score badge */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
            color: #fff;
            letter-spacing: 0.02em;
        }
        .badge.high { background: var(--badge-high); }
        .badge.mid  { background: var(--badge-mid); }
        .badge.low  { background: var(--badge-low); }

        /* Score loading shimmer */
        .score-loading {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shimmer-bar {
            width: 50px;
            height: 22px;
            border-radius: 20px;
            background: linear-gradient(90deg, var(--border-light) 25%, var(--border) 50%, var(--border-light) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease infinite;
        }
        .shimmer-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .reason {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 8px;
            line-height: 1.45;
        }
        .poster-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .poster-link:hover { color: var(--accent-hover); text-decoration: underline; }

        /* Checkmark overlay */
        .card.selected::after {
            content: "\2713";
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* ── Bottom bar (Next / Generate) ────────────────────── */
        .bottom-bar {
            max-width: 900px;
            margin: 32px auto;
            padding: 0 24px;
            text-align: center;
        }
        .bottom-bar .status-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .bottom-bar .btn-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ── Config panel (Step 2) ───────────────────────────── */
        .config-header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        .config-header h2 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 600;
        }
        .config-header .btn-ghost {
            margin-right: 12px;
        }

        /* ── Generating overlay ───────────────────────────────── */
        .generating-status {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .generating-status .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Fade-in animation for scores */
        .score-appear { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Hide utility ────────────────────────────────────── */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<div class="header">
    <div class="header-left">
        <h1 id="appTitle"></h1>
        <p id="appSubtitle"></p>
    </div>
    <div class="lang-toggle" id="langToggle">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="zh">中文</button>
    </div>
</div>

<!-- ── Phase: Search ─────────────────────────────────────────── -->
<div class="panel" id="searchPanel">
    <label id="lbl_keyword"></label>
    <input type="text" id="keyword" placeholder="">

    <label id="lbl_category"></label>
    <input type="text" id="category" placeholder="">

    <div class="field-row">
        <div>
            <label id="lbl_maxPins"></label>
            <input type="number" id="maxPins" value="40" min="1" max="100">
        </div>
        <div>
            <label id="lbl_timeout"></label>
            <input type="number" id="timeout" value="180" min="30" max="600">
        </div>
    </div>

    <button class="btn btn-primary" id="btnSearch"></button>
</div>

<!-- ── Phase: Progress (before images load) ──────────────────── -->
<div class="panel progress-panel hidden" id="progressPanel">
    <div class="spinner"></div>
    <p class="progress-text" id="progressText"></p>
    <div class="progress-bar-wrap hidden" id="progressBarWrap">
        <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <p class="progress-detail hidden" id="progressDetail"></p>
</div>

<!-- ── Phase: Gallery ────────────────────────────────────────── -->
<div class="hidden" id="gallerySection">
    <div class="gallery-toolbar" id="galleryToolbar">
        <div class="left">
            <span class="scoring-badge hidden" id="scoringBadge">
                <span class="dot"></span>
                <span id="scoringLabel"></span>
            </span>
            <span class="count" id="galleryCount"></span>
        </div>
        <div>
            <button class="btn btn-ghost" id="btnSelectAll"></button>
            <button class="btn btn-ghost" id="btnNewSearch"></button>
        </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="bottom-bar" id="bottomBar">
        <p class="status-text" id="statusText"></p>
        <div class="btn-row">
            <button class="btn btn-primary" id="btnNext" disabled></button>
        </div>
    </div>
</div>

<!-- ── Phase: Config ─────────────────────────────────────────── -->
<div class="panel hidden" id="configPanel">
    <div class="config-header">
        <button class="btn btn-ghost" id="btnBack">&#8592;</button>
        <h2 id="configTitle"></h2>
    </div>

    <label id="lbl_productName"></label>
    <input type="text" id="productName" placeholder="">

    <div class="field-row">
        <div>
            <label id="lbl_price"></label>
            <input type="text" id="price" placeholder="">
        </div>
        <div>
            <label id="lbl_tagline"></label>
            <input type="text" id="tagline" placeholder="">
        </div>
    </div>

    <label id="lbl_logoUrl"></label>
    <input type="text" id="logoUrl" placeholder="">

    <div class="generating-status hidden" id="generatingStatus">
        <span class="spinner"></span>
        <span id="generatingText"></span>
    </div>

    <button class="btn btn-primary" id="btnGenerate" style="margin-top: 8px;"></button>
</div>

<script>
// ── i18n ────────────────────────────────────────────────────────
const T = {

    },
    zh: {
        title: "Pinterest \u6d77\u62a5\u52a9\u624b",
        subtitle: "\u53d1\u73b0\u3001\u7b5b\u9009\u5e76\u751f\u6210\u7cbe\u7f8e\u4ea7\u54c1\u6d77\u62a5",
        keyword_label: "\u60a8\u60f3\u641c\u7d22\u4ec0\u4e48\u4ea7\u54c1\uff1f",
        keyword_ph: "\u4f8b\u5982\uff1a\u4e1d\u7ef8\u534a\u88d9\u3001\u665a\u793c\u670d\u3001\u590f\u5b63\u5e3d\u5b50\u2026",

        category_ph: "\u4f8b\u5982\uff1a\u8fde\u8863\u88d9\u3001\u534a\u88d9 \u2014 \u9ed8\u8ba4\u4f7f\u7528\u5173\u952e\u8bcd",
        max_pins: "\u6700\u5927\u56fe\u7247\u6570",
        timeout: "\u8d85\u65f6\uff08\u79d2\uff09",
        search_btn: "\u641c\u7d22 Pinterest",
        connecting: "\u6b63\u5728\u8fde\u63a5 Pinterest\u2026",
        extracting: "\u6b63\u5728\u52a0\u8f7d Pinterest \u7ed3\u679c\u2026",
        scoring: "AI \u6b63\u5728\u8bc4\u5206",
        analyzing: "\u5206\u6790\u4e2d\u2026",
        score_of: "/",
        select_all: "\u5168\u9009",
        clear_all: "\u6e05\u9664",
        new_search: "\u65b0\u641c\u7d22",
        next_btn: "\u4e0b\u4e00\u6b65 \u2192",
        back_btn: "\u2190 \u8fd4\u56de",
        config_title: "\u4ea7\u54c1\u4fe1\u606f",
        product_name: "\u4ea7\u54c1\u540d\u79f0",
        product_name_ph: "\u4f8b\u5982\uff1a\u4e1d\u7ef8\u665a\u793c\u670d",
        price: "\u4ef7\u683c",
        price_ph: "\u4f8b\u5982\uff1a\u00a5699",
        tagline: "\u5ba3\u4f20\u8bed",
        tagline_ph: "\u4f8b\u5982\uff1a\u4f18\u96c5\u91cd\u65b0\u5b9a\u4e49",
        logo_url: "Logo \u94fe\u63a5\uff08\u53ef\u9009\uff09",
        logo_url_ph: "https://\u2026",
        generate_btn: "\u751f\u6210\u6d77\u62a5",
        generating: "\u6b63\u5728\u751f\u6210\u6d77\u62a5\u2026",
        generated: "\u5f20\u6d77\u62a5\u5df2\u751f\u6210",
        view_poster: "\u67e5\u770b\u6d77\u62a5",
        no_results: "\u672a\u627e\u5230\u56fe\u7247\uff0c\u8bf7\u5c1d\u8bd5\u5176\u4ed6\u641c\u7d22\u8bcd\u3002",
        selected_count: "\u5df2\u9009\u62e9",
        select_prompt: "\u9009\u62e9\u56fe\u7247\u4ee5\u7ee7\u7eed",
        images_found: "\u5f20\u56fe\u7247",
        scoring_complete: "\u8bc4\u5206\u5b8c\u6210",
    }
};

let lang = localStorage.getItem("pinterest_agent_lang") || "en";
function t(key) { return T[lang][key] || T.en[key] || key; }

// ── DOM refs ────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const searchPanel    = $("searchPanel");
const progressPanel  = $("progressPanel");
const gallerySection = $("gallerySection");
const configPanel    = $("configPanel");
const grid           = $("grid");

let results    = [];
let selected   = new Set();
let pollTimer  = null;
let isScoring  = false;

// ── Apply language ──────────────────────────────────────────────
function applyLang() {
    localStorage.setItem("pinterest_agent_lang", lang);
    document.querySelectorAll(".lang-toggle button").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
    });

    $("appTitle").textContent     = t("title");
    $("appSubtitle").textContent  = t("subtitle");
    $("lbl_keyword").textContent  = t("keyword_label");
    $("keyword").placeholder      = t("keyword_ph");
    $("lbl_category").textContent = t("category_label");
    $("category").placeholder     = t("category_ph");
    $("lbl_maxPins").textContent  = t("max_pins");
    $("lbl_timeout").textContent  = t("timeout");
    $("btnSearch").textContent    = t("search_btn");
    $("btnSelectAll").textContent = t("select_all");
    $("btnNewSearch").textContent = t("new_search");
    $("btnNext").textContent      = t("next_btn");
    $("btnBack").textContent      = t("back_btn");
    $("configTitle").textContent  = t("config_title");
    $("lbl_productName").textContent = t("product_name");
    $("productName").placeholder  = t("product_name_ph");
    $("lbl_price").textContent    = t("price");
    $("price").placeholder        = t("price_ph");
    $("lbl_tagline").textContent  = t("tagline");
    $("tagline").placeholder      = t("tagline_ph");
    $("lbl_logoUrl").textContent  = t("logo_url");
    $("logoUrl").placeholder      = t("logo_url_ph");
    updateGenerateBtn();
    updateNextBtn();
    if (results.length) renderGalleryMeta();
}

$("langToggle").addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    lang = e.target.dataset.lang;
    applyLang();
});

// ── Phase management ────────────────────────────────────────────
function showPhase(phase) {
    searchPanel.classList.toggle("hidden", phase !== "search");
    progressPanel.classList.toggle("hidden", phase !== "progress");
    gallerySection.classList.toggle("hidden", phase !== "gallery");
    configPanel.classList.toggle("hidden", phase !== "config");
}

// ── Helpers ─────────────────────────────────────────────────────
function badgeClass(score) {
    if (score >= 7) return "high";
    if (score >= 4) return "mid";
    return "low";
}

function updateNextBtn() {
    const n = selected.size;
    $("btnNext").disabled = n === 0;
    $("btnNext").textContent = n > 0
        ? `${t("next_btn")} (${n})`
        : t("next_btn");
}

function updateGenerateBtn() {
    const n = selected.size;
    $("btnGenerate").textContent = `${t("generate_btn")} (${n})`;
    $("btnGenerate").disabled = n === 0;
}

function renderGalleryMeta() {
    const scored = results.filter(r => r.score !== null).length;
    const total  = results.length;

    if (scored < total && isScoring) {
        $("scoringBadge").classList.remove("hidden");
        $("scoringLabel").textContent = `${t("scoring")} (${scored}/${total})`;
    } else {
        $("scoringBadge").classList.add("hidden");
    }

    $("galleryCount").textContent = `${total} ${t("images_found")}`;
    const sel = selected.size;
    $("statusText").textContent = sel > 0
        ? `${sel} ${t("selected_count")}`
        : t("select_prompt");
}

// ── Render grid ─────────────────────────────────────────────────
function renderGrid() {
    grid.innerHTML = "";
    results.forEach(item => {
        const card = document.createElement("div");
        card.className = "card" + (selected.has(item.id) ? " selected" : "");

        const isLoading = item.score === null;
        let bodyHTML;
        if (isLoading) {
            bodyHTML = `
                <div class="score-loading">
                    <div class="shimmer-bar"></div>
                    <span class="shimmer-text">${t("analyzing")}</span>
                </div>`;
        } else {
            bodyHTML = `
                <span class="badge ${badgeClass(item.score)} score-appear">${item.score}/10</span>
                <p class="reason">${item.reason}</p>
                ${item.poster_path ? `<a class="poster-link" href="/${item.poster_path}" target="_blank">${t("view_poster")}</a>` : ""}`;
        }

        card.innerHTML = `
            <img src="${item.thumbnail_url}" alt="Pin ${item.id}" loading="lazy">
            <div class="card-body">${bodyHTML}</div>`;

        card.addEventListener("click", e => {
            if (e.target.closest(".poster-link")) return;
            if (selected.has(item.id)) {
                selected.delete(item.id);
            } else {
                selected.add(item.id);
            }
            renderGrid();
            updateNextBtn();
            renderGalleryMeta();
        });
        grid.appendChild(card);
    });
}

// ── Search flow ─────────────────────────────────────────────────
$("btnSearch").addEventListener("click", async () => {
    const keyword = $("keyword").value.trim();
    if (!keyword) { alert(t("keyword_label")); return; }

    $("btnSearch").disabled = true;
    showPhase("progress");
    $("progressText").textContent = t("connecting");
    $("progressBarWrap").classList.add("hidden");
    $("progressDetail").classList.add("hidden");

    try {
        const res = await fetch("/api/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                keyword,
                category: $("category").value.trim() || "",
                max_pins: parseInt($("maxPins").value) || 40,
                session_timeout_s: parseInt($("timeout").value) || 180,
            }),
        });

        if (!res.ok) {
            const err = await res.json();
            alert(err.error || "Search failed");
            showPhase("search");
            $("btnSearch").disabled = false;
            return;
        }

        isScoring = true;
        pollTimer = setInterval(pollStatus, 1500);
    } catch (e) {
        alert("Network error: " + e.message);
        showPhase("search");
        $("btnSearch").disabled = false;
    }
});

async function pollStatus() {
    try {
        const data = await fetch("/api/search/status").then(r => r.json());
        const msg = data.progress || "";

        // If images are ready, switch to gallery view
        if (data.images_ready) {
            await refreshResults();
            if (gallerySection.classList.contains("hidden")) {
                showPhase("gallery");
            }
        }

        // Update progress bar in progress panel (before gallery appears)
        if (progressPanel && !progressPanel.classList.contains("hidden")) {
            const scoringMatch = msg.match(/Scoring pin (\d+) of (\d+)/);
            const scoredMatch  = msg.match(/Scored pin (\d+) of (\d+): (\d+)\/10/);

            if (scoredMatch || scoringMatch) {
                const m = scoredMatch || scoringMatch;
                const cur = parseInt(m[1]);
                const tot = parseInt(m[2]);
                const pct = Math.round((cur / tot) * 100);
                $("progressText").textContent = `${t("scoring")} (${cur}/${tot})`;
                $("progressBarFill").style.width = pct + "%";
                $("progressBarWrap").classList.remove("hidden");
                $("progressDetail").classList.remove("hidden");
                $("progressDetail").textContent = scoredMatch
                    ? `Pin ${cur}: ${scoredMatch[3]}/10`
                    : `Pin ${cur}\u2026`;
            } else if (msg.includes("Connecting")) {
                $("progressText").textContent = t("connecting");
            } else if (msg.includes("extracting") || msg.includes("Loading") || msg.includes("Found")) {
                $("progressText").textContent = t("extracting");
            } else if (msg.includes("Extracted") || msg.includes("images_extracted")) {
                $("progressText").textContent = t("extracting");
            } else {
                $("progressText").textContent = msg || t("connecting");
            }
        }

        // Update gallery scoring badge
        if (!gallerySection.classList.contains("hidden")) {
            renderGalleryMeta();
        }

        if (data.status === "done") {
            clearInterval(pollTimer);
            pollTimer = null;
            isScoring = false;
            await refreshResults();
            if (gallerySection.classList.contains("hidden")) {
                showPhase("gallery");
            }
            renderGalleryMeta();
            $("btnSearch").disabled = false;
        } else if (data.status === "error") {
            clearInterval(pollTimer);
            pollTimer = null;
            isScoring = false;
            alert(data.error || "Search failed");
            showPhase("search");
            $("btnSearch").disabled = false;
        }
    } catch (e) {
        // Network hiccup — keep polling
    }
}

async function refreshResults() {
    try {
        const res = await fetch("/api/results");
        const newResults = await res.json();

        if (newResults.length === 0) return;

        results = newResults;
        renderGrid();
        updateNextBtn();
    } catch (e) {
        // Ignore transient errors
    }
}

// ── Select All ──────────────────────────────────────────────────
$("btnSelectAll").addEventListener("click", () => {
    if (selected.size > 0) {
        selected.clear();
        $("btnSelectAll").textContent = t("select_all");
    } else {
        results.forEach(r => selected.add(r.id));
        $("btnSelectAll").textContent = t("clear_all");
    }
    renderGrid();
    updateNextBtn();
    renderGalleryMeta();
});

// ── New Search ──────────────────────────────────────────────────
$("btnNewSearch").addEventListener("click", () => {
    results = [];
    selected.clear();
    isScoring = false;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    showPhase("search");
    $("btnSearch").disabled = false;
});

// ── Next → Config ───────────────────────────────────────────────
$("btnNext").addEventListener("click", () => {
    if (selected.size === 0) return;
    showPhase("config");
    updateGenerateBtn();
    $("generatingStatus").classList.add("hidden");
    $("btnGenerate").disabled = false;
});

// ── Back ← Gallery ──────────────────────────────────────────────
$("btnBack").addEventListener("click", () => {
    showPhase("gallery");
});

// ── Generate Posters ────────────────────────────────────────────
$("btnGenerate").addEventListener("click", async () => {
    if (selected.size === 0) return;
    $("btnGenerate").disabled = true;
    $("generatingStatus").classList.remove("hidden");
    $("generatingText").textContent = t("generating");

    try {
        const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                selected_ids: [...selected],
                product_name: $("productName").value || "Product",
                price: $("price").value || "",
                tagline: $("tagline").value || "",
                logo_url: $("logoUrl").value || "",
            }),
        });
        const data = await res.json();
        const count = data.generated?.filter(g => !g.error).length || 0;
        $("generatingText").textContent = `${count} ${t("generated")}`;
        selected.clear();
        await refreshResults();

        // Switch back to gallery to show poster links
        setTimeout(() => {
            showPhase("gallery");
            renderGalleryMeta();
        }, 1500);
    } catch (e) {
        $("generatingText").textContent = "Error: " + e.message;
    } finally {
        $("btnGenerate").disabled = false;
    }
});

// ── Init ────────────────────────────────────────────────────────
showPhase("search");
applyLang();
</script>
</body>
</html>
